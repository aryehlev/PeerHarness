[package]
name = "ph-identity"
description = "PeerHarness identity: keystores, device identity, circle authority, invites, membership registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
ph-core.workspace = true
ph-protocol.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
base64.workspace = true
hex.workspace = true
argon2 = { workspace = true, features = ["zeroize"] }
chacha20poly1305 = { workspace = true, features = ["zeroize"] }
rpassword.workspace = true
# The OS credential store. keyring's default `v1` feature selects the native store per
# platform: Keychain Services on macOS, Credential Manager on Windows and the (pure-Rust
# zbus) Secret Service elsewhere. The Secret Service is only used when the `os` backend
# is explicitly chosen; the Linux default backend is `file` (ADR-004).
keyring.workspace = true

[dev-dependencies]
tempfile.workspace = true
