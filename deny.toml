# cargo-deny configuration for the PeerHarness workspace.
#
# Run locally with `cargo deny check` (https://github.com/EmbarkStudios/cargo-deny).
# CI runs the same check through EmbarkStudios/cargo-deny-action.
#
# Policy:
# * advisories: every RustSec vulnerability fails the check; yanked crates fail it;
#   "unmaintained" advisories fail it only for crates the workspace depends on directly.
# * licenses: permissive licenses only. The allowlist was built from the license
#   expressions of every package in `cargo metadata --locked`. Copyleft-only crates are
#   not allowed. Some entries are not used by today's graph; cargo-deny prints a
#   "license-not-encountered" warning for those, which does not fail the check.
# * sources: crates.io only, no git dependencies.

[graph]
# The platforms we build releases for (docs/release.md). Windows is not supported yet,
# so Windows-only crates are left out of the graph.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "workspace"
# Every ignored advisory needs an id, a reason and a link to the tracking issue.
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
exceptions = []

[bans]
# libp2p and its crypto stack pull in a few duplicate versions; report them without failing.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
