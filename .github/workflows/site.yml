name: Site

# Publishes the folder `site/` as the project page on GitHub Pages. The folder is
# static: nothing is built, and nothing but that folder is published. Pages has to be
# switched on once in the repository's settings, with "GitHub Actions" as its source.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  publish:
    name: publish site/ to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
      # Tells the search engines that take IndexNow (Bing among them) that the page
      # changed (ADR-049). Only the page's address and the key are sent. The key is
      # public by design: it is the name and the content of a file in `site/`, which
      # shows them that the request comes from whoever publishes the page. A request
      # that fails does not fail the publication.
      - name: tell search engines that the page changed (IndexNow)
        continue-on-error: true
        env:
          PAGE: https://aryehlev.github.io/PeerHarness/
          KEY: a1248b0fe0e1697ec9adaef2d69872b6
        run: |
          curl -sS --max-time 20 -o /dev/null -w 'IndexNow answered %{http_code}\n' -G \
            --data-urlencode "url=${PAGE}" \
            --data-urlencode "key=${KEY}" \
            --data-urlencode "keyLocation=${PAGE}${KEY}.txt" \
            https://api.indexnow.org/indexnow
